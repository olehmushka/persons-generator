version: 2

project_name: persons-generator

before:
  hooks:
    - go mod tidy

builds:
  - id: persons-generator
    main: .
    binary: persons-generator
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    # Explicit rather than relying on the default recursive glob for
    # license/readme/changelog files, which is easy to trip up on
    # unrelated local directories (e.g. gitignored data dirs) outside CI.
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"

release:
  github:
    owner: olehmushka
    name: persons-generator
