name: Generate demo GIF

on:
  workflow_dispatch: {}

jobs:
  vhs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Generate GIF
        uses: charmbracelet/vhs-action@v2
        with:
          path: demo.tape

      - name: Commit GIF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add examples/demo.gif
          git diff --staged --quiet || git commit -m "chore: regenerate demo.gif [skip ci]"
          git push
